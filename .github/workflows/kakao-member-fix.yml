# 1회성 데이터 수정 워크플로 — 카톡 연동 팀원지정 정정 (2026-07-30)
# 실행 완료 후 이 파일과 스크립트는 삭제한다.
# (workflow_dispatch 전용 워크플로는 main에 없으면 API 실행이 불가해,
#  이 파일 자신이 변경된 푸시에서만 도는 push 트리거로 1회 실행한다.
#  파일을 삭제하는 푸시에서는 워크플로 정의가 없으므로 실행되지 않는다.)
name: Kakao member fix (one-off)

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/kakao-member-fix.yml"
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install functions dependencies (firebase-admin)
        run: npm ci --prefix functions

      - name: Write service account key
        run: |
          cat > "$RUNNER_TEMP/gcp-sa.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      - name: Run fix
        run: NODE_PATH="$PWD/functions/node_modules" node .github/scripts/kkfix.cjs
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
