name: Deploy Apps Script

# google-drive-sync.gs 가 바뀐 푸시에서 구글 Apps Script 웹앱을 자동 배포한다.
# (deploy-gs.sh 와 같은 방식: Code.gs + appsscript.json 스테이징 → clasp push → 기존 배포 갱신으로 /exec URL 유지)
#
# 최초 1회 준비(본인 PC에서):
#   1) npx --yes @google/clasp@2.4.2 login   (서버 소유 구글 계정으로 브라우저 로그인)
#   2) 생성된 ~/.clasprc.json 내용 전체 → GitHub 저장소 Secrets 에 CLASPRC_JSON 으로 등록
#   3) Apps Script 편집기 → 프로젝트 설정 ⚙️ → 스크립트 ID → Secrets 에 GS_SCRIPT_ID 로 등록
#   4) https://script.google.com/home/usersettings 에서 "Apps Script API" 사용 ON
# 시크릿이 없으면 경고만 남기고 건너뛴다(빌드 실패 아님 — 요약에 안내가 뜬다).
#
# 배포가 실제로 반영됐는지는 마지막 단계가 웹앱 ?ping=1 을 호출해 스스로 확인한다
# (google-drive-sync.gs 의 SERVER_VERSION 과 응답이 같아야 성공 — 다르면 배포 미반영,
#  로그인 페이지가 오면 웹앱 액세스 권한이 '모든 사용자'가 아님).
# ⚠️ 서버 코드를 의미 있게 고치면 SERVER_VERSION 도 함께 올릴 것 — 이 확인이 살아 있으려면 필요.

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "google-drive-sync.gs"
      - "apps-script/appsscript.json"
      - ".github/workflows/gs-deploy.yml"
  workflow_dispatch: {}

concurrency:
  group: gs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # 기존 웹앱 /exec URL 의 배포 ID (index.html DRIVE_SYNC_URL 과 동일) — 이 배포를 새 버전으로 갱신해 URL 을 유지한다
      GS_DEPLOYMENT_ID: AKfycbwpknpHr2g8xh1C0gP7Bo6fR7PxpCarjTvQuSUys_5DTXMxNkDASGfOkSktDqpjdDU2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # clasp 2.4.2 는 옛 버전이라 러너 기본 Node 가 너무 새로우면 깨질 수 있어 20 으로 고정
      - name: Node 20 준비
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 시크릿 확인
        id: check
        run: |
          if [ -z "${{ secrets.CLASPRC_JSON }}" ] || [ -z "${{ secrets.GS_SCRIPT_ID }}" ]; then
            echo "::warning::CLASPRC_JSON / GS_SCRIPT_ID 시크릿이 없어 앱스크립트 자동 배포를 건너뜁니다."
            {
              echo "### ⏭️ 앱스크립트 배포를 건너뛰었습니다"
              echo ""
              echo "저장소 **Settings → Secrets and variables → Actions** 에 아래 두 개를 등록하면 자동 배포가 켜집니다."
              echo ""
              echo "| 시크릿 | 값 |"
              echo "| --- | --- |"
              echo "| \`CLASPRC_JSON\` | 본인 PC \`%USERPROFILE%\\.clasprc.json\` 파일 내용 전체 (\`npx --yes @google/clasp@2.4.2 login\` 으로 생성) |"
              echo "| \`GS_SCRIPT_ID\` | Apps Script 편집기 → 프로젝트 설정 ⚙️ → 스크립트 ID |"
              echo ""
              echo "그리고 <https://script.google.com/home/usersettings> 에서 **Apps Script API** 를 ON."
              echo "등록 후 이 워크플로를 **Run workflow** 로 다시 실행하면 배포됩니다."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: clasp 로그인 정보 작성
        if: steps.check.outputs.ready == 'true'
        run: |
          cat > ~/.clasprc.json <<'EOF'
          ${{ secrets.CLASPRC_JSON }}
          EOF

      - name: 스테이징 준비 (Code.gs + appsscript.json)
        if: steps.check.outputs.ready == 'true'
        run: |
          rm -rf .gs-deploy && mkdir -p .gs-deploy
          cp google-drive-sync.gs .gs-deploy/Code.gs
          cp apps-script/appsscript.json .gs-deploy/appsscript.json
          printf '{ "scriptId": "%s", "rootDir": "." }\n' "${{ secrets.GS_SCRIPT_ID }}" > .gs-deploy/.clasp.json

      - name: 코드 업로드(clasp push)
        if: steps.check.outputs.ready == 'true'
        working-directory: .gs-deploy
        run: npx --yes @google/clasp@2.4.2 push -f

      - name: 기존 배포 갱신(clasp deploy — /exec URL 유지)
        if: steps.check.outputs.ready == 'true'
        working-directory: .gs-deploy
        run: |
          npx --yes @google/clasp@2.4.2 deploy -i "$GS_DEPLOYMENT_ID" -d "auto deploy ${GITHUB_SHA::7}"
          echo "✅ clasp deploy 완료 — 웹앱 URL 유지: https://script.google.com/macros/s/$GS_DEPLOYMENT_ID/exec"

      # 실제로 라이브에 반영됐는지 웹앱에 직접 물어본다 (?ping=1 → {"ok":true,"version":"gsheet-NN"})
      - name: 배포 확인 (?ping=1 서버 버전 대조)
        if: steps.check.outputs.ready == 'true'
        run: |
          url="https://script.google.com/macros/s/$GS_DEPLOYMENT_ID/exec?ping=1"
          want="$(sed -n "s/^var SERVER_VERSION *= *'\([^']*\)'.*/\1/p" google-drive-sync.gs | head -1)"
          echo "기대 버전: $want"
          got=""; body=""
          for i in 1 2 3 4 5 6; do
            body="$(curl -sS -L --max-time 30 "$url" || true)"
            got="$(printf '%s' "$body" | sed -n 's/.*"version" *: *"\([^"]*\)".*/\1/p' | head -1)"
            [ "$got" = "$want" ] && break
            echo "…반영 대기 ($i/6) — 받은 값: ${got:-없음}"
            sleep 5
          done
          if [ "$got" = "$want" ]; then
            echo "✅ 라이브 확인 완료 — 서버 버전 $got"
            echo "### ✅ 앱스크립트 배포 완료 (서버 버전 \`$got\`)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$body" | head -c 500
          if printf '%s' "$body" | grep -qiE 'accounts\.google\.com|ServiceLogin|<title>.*(로그인|Sign in)'; then
            echo "::error::웹앱이 로그인 페이지를 돌려줍니다 — 배포의 '액세스 권한'이 '모든 사용자'가 아닙니다. Apps Script 편집기 → 배포 관리 → 수정 → 액세스 권한을 '모든 사용자'로 바꾸세요."
          else
            echo "::error::배포 후에도 서버 버전이 다릅니다 (기대 $want / 실제 ${got:-응답없음}) — 배포 ID가 실제 사용 중인 /exec 와 다를 수 있습니다."
          fi
          exit 1
