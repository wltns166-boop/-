name: Deploy to Firebase

# main 또는 claude/* 브랜치에 푸시되면 자동으로 Firebase Hosting에 배포한다.
on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

# 연속 푸시 시 배포가 겹치지 않게 직렬화(어느 실행이든 작업 브랜치 최신을 배포하므로 대기 중 취소돼도 무해)
concurrency:
  group: hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 2026-11-04(협업 대비): 어느 브랜치에 푸시돼도 **작업 브랜치(jolly-carson) 최신**을 배포한다.
      #   두 사람(박지순·백동현)의 세션이 서로 다른 claude/** 브랜치에 푸시해도, 낡은 코드가 라이브를 덮지 않게.
      #   → 라이브에 올리려면 반드시 작업 브랜치에 푸시할 것. 작업 브랜치를 바꾸면 이 ref도 함께 바꿀 것.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/jolly-carson-bvrih0

      # Firebase 공식 액션으로 호스팅(HTML)을 라이브 채널에 배포
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: team-tops-intranet
          channelId: live

      # Firestore 보안 규칙(firestore.rules)도 함께 배포 — push_tokens 등 모든 컬렉션 허용 보장
      - name: Write service account key
        run: |
          cat > "$RUNNER_TEMP/gcp-sa.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF
      - name: Deploy Firestore & Storage rules
        run: npx -y firebase-tools@13 deploy --only firestore:rules,storage --project team-tops-intranet --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-sa.json
