<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카카오 연동 — TEAM TOPS</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#01061a,#0a1236);font-family:'Pretendard','Malgun Gothic',sans-serif}
  .card{background:#fff;border-radius:18px;padding:36px 30px;max-width:360px;width:88%;text-align:center;
    box-shadow:0 18px 60px rgba(0,0,0,.45)}
  .ic{font-size:44px;margin-bottom:10px}
  h1{font-size:18px;color:#1a1a3a;margin:0 0 10px}
  p{font-size:13.5px;color:#555;line-height:1.7;margin:0 0 20px;word-break:keep-all}
  .err p{color:#b03030}
  a.btn{display:inline-block;padding:11px 26px;border-radius:9px;background:#4050cc;color:#fff;
    text-decoration:none;font-size:14px;font-weight:700}
  .spin{width:34px;height:34px;border:4px solid #e8e8f5;border-top-color:#4050cc;border-radius:50%;
    margin:0 auto 14px;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin"></div>
  <h1>카카오 계정 연동 중…</h1>
  <p>잠시만 기다려주세요.</p>
</div>
<script>
(function(){
  var card=document.getElementById('card');
  // URL 파라미터·서버 응답을 innerHTML에 넣기 전 반드시 이스케이프 (반사형 XSS 방지)
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function show(icon,title,msg,isErr){
    card.className='card'+(isErr?' err':'');
    card.innerHTML='<div class="ic">'+icon+'</div><h1>'+title+'</h1><p>'+msg+'</p>'
      +'<a class="btn" href="/">인트라넷으로 돌아가기</a>';
  }
  var q={};
  location.search.replace(/^\?/,'').split('&').forEach(function(kv){
    var p=kv.split('='); if(p[0]) q[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' '));
  });
  if(q.error){
    show('⚠️','연동이 취소되었습니다', esc(q.error_description||q.error)+'<br>다시 시도하려면 인트라넷의 [카톡 자동발송] 설정에서 연동 버튼을 눌러주세요.', true);
    return;
  }
  if(!q.code){
    show('⚠️','잘못된 접근입니다','이 페이지는 카카오 로그인 후 자동으로 열리는 페이지입니다.<br>인트라넷의 [카톡 자동발송] 설정에서 연동 버튼을 눌러주세요.', true);
    return;
  }
  fetch('/api',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({kakao:'link', code:q.code, redirectUri:location.origin+location.pathname})
  }).then(function(r){return r.json();}).then(function(j){
    if(j&&j.ok){
      show('✅','연동 완료!','<b>'+esc(j.nick||'')+'</b>님의 카카오 계정이 연동되었습니다.<br>관리자가 [카톡 자동발송] 설정에서 <b>승인</b>하면 매일 일일보고서가 카카오톡 "나와의 채팅"으로 발송됩니다.');
    }else{
      show('⚠️','연동 실패',esc((j&&j.error&&j.error.message)||'알 수 없는 오류가 발생했습니다.'), true);
    }
  }).catch(function(e){
    show('⚠️','연동 실패','서버 통신 오류: '+esc(e.message), true);
  });
})();
</script>
</body>
</html>
