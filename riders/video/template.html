<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: P; font-weight: 400; src: url(fonts/Pretendard-Regular.woff2) format('woff2'); }
  @font-face { font-family: P; font-weight: 500; src: url(fonts/Pretendard-Medium.woff2) format('woff2'); }
  @font-face { font-family: P; font-weight: 600; src: url(fonts/Pretendard-SemiBold.woff2) format('woff2'); }
  @font-face { font-family: P; font-weight: 700; src: url(fonts/Pretendard-Bold.woff2) format('woff2'); }
  @font-face { font-family: P; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2) format('woff2'); }
  @font-face { font-family: P; font-weight: 900; src: url(fonts/Pretendard-Black.woff2) format('woff2'); }

  :root {
    --c: #2F80ED;          /* 카테고리 색 (JS에서 교체) */
    --c-soft: #2F80ED22;
    --ink: #121826;
    --ink-2: #4A5468;
    --ink-3: #8A93A6;
    --bg: #F6F7FB;
    --card: #FFFFFF;
    --line: #E6E9F0;
    --ok: #12B76A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body { font-family: P, sans-serif; background: var(--bg); color: var(--ink); letter-spacing: -0.02em; word-break: keep-all; }

  #stage { position: absolute; inset: 0; overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; opacity: .9; }
  #b1 { width: 1300px; height: 1300px; background: radial-gradient(closest-side, var(--c-soft), transparent); left: -420px; top: -520px; }
  #b2 { width: 1100px; height: 1100px; background: radial-gradient(closest-side, #FFD8A840, transparent); right: -360px; bottom: -460px; }
  #grid { position: absolute; inset: 0; background-image: radial-gradient(#12182610 1.5px, transparent 1.5px); background-size: 36px 36px; }

  /* 상단 바 */
  #top { position: absolute; left: 96px; right: 96px; top: 54px; display: flex; align-items: center; justify-content: space-between; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: 28px; color: var(--ink); }
  .mark { width: 46px; height: 46px; border-radius: 14px; background: var(--c); display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 24px; }
  .brand small { font-weight: 500; color: var(--ink-3); font-size: 24px; margin-left: 6px; }
  .ep { font-weight: 700; font-size: 26px; color: var(--c); background: #fff; border: 2px solid var(--c-soft); padding: 10px 22px; border-radius: 999px; }

  /* 하단 자막 + 진행바 */
  #cap-wrap { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; z-index: 6; }
  #cap { max-width: 1560px; background: rgba(18, 24, 38, .9); color: #fff; font-size: 40px; font-weight: 600; line-height: 1.4; padding: 18px 40px; border-radius: 20px; text-align: center; }
  #cap:empty { display: none; }
  #prog { position: absolute; left: 0; bottom: 0; height: 10px; background: var(--c); z-index: 7; }
  #prog-bg { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: #12182612; z-index: 6; }

  .scene { position: absolute; left: 96px; right: 96px; top: 150px; bottom: 200px; display: none; }
  .scene.on { display: block; }
  [data-at] { opacity: 0; will-change: transform, opacity; }

  /* intro */
  .intro { display: flex; align-items: center; gap: 90px; height: 100%; }
  .intro .emoji { width: 360px; height: 360px; flex: none; border-radius: 96px; background: #fff; display: grid; place-items: center; font-size: 190px; box-shadow: 0 30px 80px -30px var(--c), inset 0 0 0 6px var(--c-soft); }
  .intro .kicker { font-size: 34px; font-weight: 800; color: var(--c); letter-spacing: .04em; }
  .intro h1 { font-size: 132px; font-weight: 900; line-height: 1.08; margin: 14px 0 22px; letter-spacing: -0.04em; }
  .intro p { font-size: 40px; color: var(--ink-2); font-weight: 500; line-height: 1.45; max-width: 1100px; }
  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 40px; max-width: 1200px; }
  .chip { font-size: 28px; font-weight: 700; padding: 12px 24px; border-radius: 999px; background: #fff; border: 2px solid var(--line); color: var(--ink); }
  .chip b { color: var(--c); margin-right: 8px; }

  /* rider */
  .rider { display: grid; grid-template-columns: 1.15fr .85fr; gap: 72px; height: 100%; align-items: center; }
  .tag { display: inline-flex; align-items: center; gap: 12px; font-size: 28px; font-weight: 800; color: var(--c); background: var(--c-soft); padding: 10px 22px; border-radius: 12px; }
  .rider h2 { font-size: 100px; font-weight: 900; line-height: 1.1; margin: 22px 0 18px; letter-spacing: -0.045em; }
  .rider .one { font-size: 40px; color: var(--ink-2); font-weight: 600; line-height: 1.4; }
  .pts { margin-top: 46px; display: flex; flex-direction: column; gap: 20px; }
  .pt { display: flex; align-items: center; gap: 24px; font-size: 38px; font-weight: 700; background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 22px 30px; }
  .pt i { font-style: normal; flex: none; width: 52px; height: 52px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 900; }
  .side { display: flex; flex-direction: column; gap: 30px; }
  .card { background: var(--card); border-radius: 32px; padding: 44px 46px; box-shadow: 0 24px 60px -28px #12182640; border: 2px solid var(--line); }
  .card .lbl { font-size: 28px; font-weight: 800; color: var(--ink-3); margin-bottom: 18px; display: flex; gap: 12px; align-items: center; }
  .card .big { font-size: 42px; font-weight: 800; line-height: 1.4; }
  .card.ex { border-color: var(--c); box-shadow: 0 30px 70px -30px var(--c); }
  .card.ex .lbl { color: var(--c); }
  .card.tip { background: #FFF8E6; border-color: #F5D58A; }
  .card.tip .lbl { color: #B7791F; }
  .card.tip .big { font-size: 36px; font-weight: 700; color: #5A4211; }

  /* compare */
  .cmp h3, .quiz h3, .sum h3 { font-size: 72px; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 56px; }
  .bars { display: flex; flex-direction: column; gap: 40px; }
  .bar-row { display: grid; grid-template-columns: 420px 1fr; align-items: center; gap: 36px; }
  .bar-row .bl { font-size: 42px; font-weight: 800; }
  .track { height: 96px; background: #fff; border: 2px solid var(--line); border-radius: 24px; overflow: hidden; position: relative; }
  .fill { height: 100%; background: var(--c); border-radius: 22px; width: 0; display: flex; align-items: center; justify-content: flex-end; padding-right: 26px; color: #fff; font-weight: 800; font-size: 32px; white-space: nowrap; }
  .fill.low { background: color-mix(in srgb, var(--c) 45%, white); }
  .bar-row .bt { position: absolute; left: 28px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 32px; font-weight: 700; color: var(--ink-2); }

  .nest { display: flex; gap: 80px; justify-content: center; align-items: flex-start; margin-top: -24px; }
  .ngroup { display: flex; flex-direction: column; align-items: center; gap: 22px; }
  .ngroup .gl { font-size: 44px; font-weight: 900; color: var(--c); }
  .ring { border-radius: 40px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 28px 30px; font-weight: 800; font-size: 32px; text-align: center; }
  .ring > span { margin-bottom: 22px; }

  .split { margin-top: 30px; }
  .split .total { font-size: 46px; font-weight: 800; margin-bottom: 26px; }
  .split .stack { display: flex; height: 170px; border-radius: 30px; overflow: hidden; background: #fff; border: 2px solid var(--line); }
  .split .seg { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 40px; color: #fff; font-weight: 800; overflow: hidden; white-space: nowrap; }
  .split .seg b { font-size: 52px; }
  .split .seg span { font-size: 30px; opacity: .92; }
  .split .note { margin-top: 40px; font-size: 34px; color: var(--ink-2); font-weight: 600; }

  .vs { display: grid; grid-template-columns: 1fr 120px 1fr; align-items: stretch; gap: 0; }
  .vs .vc { background: #fff; border: 2px solid var(--line); border-radius: 34px; padding: 46px 50px; }
  .vs .vc.r { border-color: var(--c); box-shadow: 0 30px 70px -30px var(--c); }
  .vs .vh { font-size: 52px; font-weight: 900; margin-bottom: 30px; }
  .vs .vc.r .vh { color: var(--c); }
  .vs ul { list-style: none; display: flex; flex-direction: column; gap: 22px; }
  .vs li { font-size: 36px; font-weight: 700; color: var(--ink-2); padding-left: 44px; position: relative; line-height: 1.35; }
  .vs li::before { content: ""; position: absolute; left: 0; top: 14px; width: 20px; height: 20px; border-radius: 50%; background: var(--line); }
  .vs .vc.r li::before { background: var(--c); }
  .vs .mid { display: grid; place-items: center; font-size: 48px; font-weight: 900; color: var(--ink-3); }

  .steps { display: flex; align-items: flex-end; gap: 40px; height: 560px; }
  .step { flex: 1; border-radius: 34px 34px 0 0; background: var(--c); color: #fff; display: flex; flex-direction: column; justify-content: flex-start; padding: 40px; transform-origin: bottom; }
  .step b { font-size: 64px; font-weight: 900; }
  .step span { font-size: 36px; font-weight: 700; opacity: .9; margin-top: 10px; }

  /* quiz */
  .quiz .qk { font-size: 34px; font-weight: 900; color: var(--c); letter-spacing: .06em; margin-bottom: 18px; }
  .quiz h3 { font-size: 64px; line-height: 1.3; max-width: 1600px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 10px; }
  .opt { position: relative; background: #fff; border: 3px solid var(--line); border-radius: 32px; padding: 46px 50px; display: flex; align-items: center; gap: 30px; font-size: 48px; font-weight: 800; }
  .opt i { font-style: normal; width: 76px; height: 76px; border-radius: 22px; background: var(--bg); display: grid; place-items: center; font-size: 40px; font-weight: 900; color: var(--ink-2); flex: none; }
  .opt .ck { position: absolute; right: 40px; width: 76px; height: 76px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-size: 46px; font-weight: 900; }
  .explain { margin-top: 40px; font-size: 40px; font-weight: 700; color: var(--ink-2); display: flex; gap: 16px; align-items: center; }
  .timer { position: absolute; right: 0; top: 0; width: 150px; height: 150px; }
  .timer svg { width: 150px; height: 150px; transform: rotate(-90deg); }
  .timer .n { position: absolute; inset: 0; display: grid; place-items: center; font-size: 60px; font-weight: 900; color: var(--c); }

  /* summary */
  .sums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; }
  .sumc { background: #fff; border: 2px solid var(--line); border-radius: 34px; padding: 50px 44px; min-height: 380px; }
  .sumc .no { width: 84px; height: 84px; border-radius: 26px; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 44px; font-weight: 900; margin-bottom: 36px; }
  .sumc p { font-size: 44px; font-weight: 800; line-height: 1.38; }

  /* outro */
  .outro { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .outro .big { font-size: 110px; font-weight: 900; letter-spacing: -0.04em; }
  .outro .sub { font-size: 40px; color: var(--ink-2); font-weight: 600; margin-top: 26px; }
  .outro .warn { margin-top: 70px; max-width: 1400px; font-size: 32px; line-height: 1.5; color: var(--ink-2); background: #fff; border: 2px solid var(--line); border-radius: 26px; padding: 30px 46px; font-weight: 500; }
  .outro .warn b { color: var(--ink); }

  /* 그림 스토리 (rider 장면 오른쪽) */
  .story { background: #fff; border: 2px solid var(--line); border-radius: 36px; padding: 40px 44px; box-shadow: 0 30px 70px -34px #12182655; }
  .story .lbl { font-size: 28px; font-weight: 800; color: var(--c); margin-bottom: 22px; }
  .story .st { display: flex; align-items: center; gap: 30px; }
  .story .em { flex: none; width: 128px; height: 128px; border-radius: 36px; background: var(--c-soft); display: grid; place-items: center; font-size: 72px; }
  .story .st:last-child .em { background: var(--c); }
  .story .tx { font-size: 38px; font-weight: 800; }
  .story .st small { display: block; font-size: 22px; font-weight: 800; color: var(--ink-3); letter-spacing: .06em; }
  .story .ar { height: 46px; margin-left: 52px; border-left: 6px dotted color-mix(in srgb, var(--c) 55%, white); }

  /* detail 장면 */
  .detail { height: 100%; display: flex; flex-direction: column; gap: 26px; }
  .dhead { display: flex; align-items: center; gap: 22px; }
  .dhead h2 { font-size: 60px; font-weight: 900; letter-spacing: -0.04em; }
  .dbody { flex: 1; display: grid; grid-template-columns: 1.3fr .7fr; gap: 40px; min-height: 0; }
  .vpanel { background: #fff; border: 2px solid var(--line); border-radius: 34px; padding: 38px 44px; display: flex; flex-direction: column; gap: 28px; }
  .vpanel .vt { font-size: 38px; font-weight: 900; letter-spacing: -0.03em; }
  .vpanel .vt::before { content: "📊 "; }
  .vpanel.treat .vt::before { content: "🩺 "; }
  .vpanel.check .vt::before { content: "✅ "; }
  .vpanel.flow .vt::before, .vpanel.timeline .vt::before { content: "🧭 "; }
  .dbody .side { justify-content: center; }
  .dbody .card { padding: 34px 36px; }
  .dbody .card .big { font-size: 36px; }
  .dbody .card.tip .big { font-size: 31px; }

  .vb { display: flex; flex-direction: column; gap: 26px; flex: 1; justify-content: center; }
  .vb .row { display: grid; grid-template-columns: 300px 1fr; gap: 26px; align-items: center; }
  .vb .rl { font-size: 34px; font-weight: 800; }
  .vb .tr { height: 84px; background: var(--bg); border-radius: 20px; overflow: hidden; }
  .vb .fl { height: 100%; width: 0; background: var(--c); border-radius: 20px; display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; color: #fff; font-size: 30px; font-weight: 800; white-space: nowrap; }

  .tl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; flex: 1; align-content: center; }
  .tl .seg { border-radius: 24px; padding: 34px 26px; text-align: center; }
  .tl .seg b { display: block; font-size: 44px; font-weight: 900; }
  .tl .seg span { display: block; margin-top: 10px; font-size: 28px; font-weight: 700; opacity: .85; }
  .tl .off { background: #EEF0F4; color: var(--ink-3); }
  .tl .half { background: color-mix(in srgb, var(--c) 30%, white); color: var(--ink); }
  .tl .full { background: var(--c); color: #fff; }
  .tl .axis { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, #D5D9E2, var(--c)); margin-top: 6px; position: relative; }
  .tl .axis::after { content: "시간 →"; position: absolute; right: 0; top: 16px; font-size: 24px; font-weight: 700; color: var(--ink-3); }

  .tg { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; align-content: center; }
  .tg.n3 { grid-template-columns: 1fr; }
  .tc { display: flex; align-items: center; gap: 24px; background: var(--bg); border-radius: 24px; padding: 22px 26px; }
  .tc .ti { flex: none; width: 96px; height: 96px; border-radius: 26px; background: #fff; display: grid; place-items: center; font-size: 56px; box-shadow: 0 10px 24px -14px #12182660; }
  .tc b { display: block; font-size: 34px; font-weight: 900; }
  .tc span { display: block; font-size: 26px; font-weight: 600; color: var(--ink-2); margin-top: 4px; line-height: 1.35; }

  .ck { display: flex; flex-direction: column; gap: 16px; flex: 1; justify-content: center; }
  .ck .r { display: flex; align-items: center; justify-content: space-between; gap: 20px; background: var(--bg); border-radius: 20px; padding: 22px 28px; font-size: 34px; font-weight: 800; }
  .ck .bd { flex: none; min-width: 150px; text-align: center; border-radius: 999px; padding: 8px 20px; font-size: 28px; font-weight: 900; }
  .ck .y .bd { background: #DCF7E9; color: #0E8A4F; }
  .ck .n .bd { background: #FDE4E4; color: #C7302F; }
  .ck .m .bd { background: #FFF1D6; color: #A86A00; }
  .ck .n { color: var(--ink-3); }

  .lv { flex: 1; display: flex; align-items: flex-end; gap: 22px; padding-top: 50px; }
  .lv .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 12px; }
  .lv .bar { width: 100%; border-radius: 18px 18px 6px 6px; background: var(--c); transform-origin: bottom; position: relative; }
  .lv .bar em { position: absolute; top: -46px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 28px; font-weight: 900; color: var(--c); white-space: nowrap; }
  .lv .ll { font-size: 30px; font-weight: 800; }

  .fw { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .fw .fs { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
  .fw .fi { width: 130px; height: 130px; border-radius: 50%; background: var(--c-soft); display: grid; place-items: center; font-size: 66px; }
  .fw .fs:last-child .fi { background: var(--c); }
  .fw b { font-size: 32px; font-weight: 900; }
  .fw span { font-size: 25px; font-weight: 700; color: var(--ink-2); }
  .fw .fa { font-size: 46px; color: var(--ink-3); font-weight: 900; padding-bottom: 70px; }

  /* journey */
  .jy h3 { font-size: 72px; font-weight: 900; letter-spacing: -0.04em; margin-bottom: 120px; }
  .jrow { display: flex; justify-content: space-between; position: relative; gap: 12px; }
  .jline { position: absolute; left: 6%; right: 6%; top: 80px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 30%, white); transform-origin: left; }
  .js { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; position: relative; }
  .js .ji { width: 168px; height: 168px; border-radius: 50%; background: #fff; border: 6px solid var(--c); display: grid; place-items: center; font-size: 84px; box-shadow: 0 20px 40px -24px var(--c); }
  .js b { font-size: 40px; font-weight: 900; }
  .js span { font-size: 25px; font-weight: 800; color: var(--c); background: var(--c-soft); border-radius: 14px; padding: 8px 14px; line-height: 1.3; max-width: 260px; }
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div>
  <div class="blob" id="b2"></div>
  <div id="grid"></div>
  <div id="top">
    <div class="brand"><div class="mark">i</div>InsureNet 특약 아카데미</div>
    <div class="ep" id="ep"></div>
  </div>
  <div id="scenes"></div>
  <div id="cap-wrap"><div id="cap"></div></div>
  <div id="prog-bg"></div><div id="prog"></div>
</div>

<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let TL = null, SCN = [], CUR = -1;

// 문장 k가 시작하는 장면 내 시각(초)
const sAt = (sc, k) => sc.sentences[Math.min(k, sc.sentences.length - 1)].at;

function sceneHTML(sc, i) {
  const at = k => sAt(sc, k).toFixed(3);
  switch (sc.type) {
    case 'intro':
      return `<div class="intro">
        <div class="emoji" data-at="0.1" data-a="pop">${TL.icon}</div>
        <div>
          <div class="kicker" data-at="0.25" data-a="up">EPISODE ${String(TL.no).padStart(2, '0')} / ${String(TL.total).padStart(2, '0')}</div>
          <h1 data-at="0.4" data-a="up">${esc(TL.title)}</h1>
          <p data-at="${at(1)}" data-a="up">${esc(TL.summary)}</p>
          <div class="chips">${TL.riderNames.map((n, j) =>
            `<div class="chip" data-at="${(sAt(sc, 2) + j * 0.18).toFixed(3)}" data-a="pop"><b>${j + 1}</b>${esc(n)}</div>`).join('')}</div>
        </div></div>`;
    case 'rider': {
      const r = sc.rider;
      return `<div class="rider">
        <div>
          <div class="tag" data-at="0.1" data-a="up">특약 ${sc.pos} / ${sc.count}</div>
          <h2 data-at="0.25" data-a="up">${esc(r.name)}</h2>
          <div class="one" data-at="0.45" data-a="up">${esc(r.oneLine)}</div>
          <div class="pts">${r.points.map((p, j) =>
            `<div class="pt" data-at="${at(j + 1)}" data-a="left"><i>${j + 1}</i>${esc(p)}</div>`).join('')}</div>
        </div>
        <div class="story" data-at="0.3" data-a="pop"><div class="lbl">🖼️ 그림으로 보기</div>${r.story.map((st, j) =>
          `${j ? `<div class="ar" data-at="${(0.9 + j * 0.8 - 0.3).toFixed(2)}" data-a="up"></div>` : ''}<div class="st" data-at="${(0.9 + j * 0.8).toFixed(2)}" data-a="left"><div class="em">${st[0]}</div><div class="tx"><small>STEP ${j + 1}</small>${esc(st[1])}</div></div>`).join('')}</div>
        </div>`;
    }
    case 'detail': {
      const r = sc.rider, v = r.visual, L = sc.lead;
      return `<div class="detail">
        <div class="dhead" data-at="0.05" data-a="up"><div class="tag">특약 ${sc.pos} / ${sc.count} · 자세히</div><h2>${esc(r.name)}</h2></div>
        <div class="dbody">
          <div class="vpanel ${v.type}" data-at="0.2" data-a="up"><div class="vt">${esc(v.title)}</div>${visualHTML(v)}</div>
          <div class="side">
            <div class="card ex" data-at="${at(L)}" data-a="pop"><div class="lbl">📌 이럴 때 받아요</div><div class="big">${esc(r.example)}</div></div>
            <div class="card tip" data-at="${at(L + 1)}" data-a="up"><div class="lbl">💡 상담 포인트</div><div class="big">${esc(r.tip)}</div></div>
          </div>
        </div></div>`;
    }
    case 'journey': {
      const J = sc.journey;
      return `<div class="jy"><h3 data-at="0.1" data-a="up">${esc(J.title)}</h3>
        <div class="jrow"><div class="jline" data-at="${at(1)}" data-a="grow" data-grow="88"></div>${J.steps.map((st, j) =>
          `<div class="js" data-at="${(sAt(sc, 1) + j * 0.55).toFixed(3)}" data-a="pop"><div class="ji">${st.icon}</div><b>${esc(st.label)}</b>
           <span data-at="${(sAt(sc, 2) + j * 0.4).toFixed(3)}" data-a="up">${esc(st.rider)}</span></div>`).join('')}</div></div>`;
    }
    case 'compare': return `<div class="cmp"><h3 data-at="0.1" data-a="up">${esc(sc.compare.title)}</h3>${compareHTML(sc)}</div>`;
    case 'quiz': {
      const q = sc.quiz;
      return `<div class="quiz">
        <div class="qk" data-at="0.1" data-a="up">QUIZ · 잠깐 퀴즈!</div>
        <h3 data-at="${at(1)}" data-a="up">${esc(q.q)}</h3>
        <div class="opts">${q.options.map((o, j) =>
          `<div class="opt" id="opt${i}_${j}" data-at="${(sAt(sc, 1) + 0.6 + j * 0.25).toFixed(3)}" data-a="pop"><i>${'AB'[j]}</i>${esc(o)}${j === q.answer ? `<div class="ck" data-at="${at(2)}" data-a="pop">✓</div>` : ''}</div>`).join('')}</div>
        <div class="explain" data-at="${(sAt(sc, 2) + 0.8).toFixed(3)}" data-a="up">💬 ${esc(q.explain)}</div>
        <div class="timer" id="timer${i}"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="#fff" stroke="#E6E9F0" stroke-width="8"/><circle class="arc" cx="50" cy="50" r="44" fill="none" stroke="var(--c)" stroke-width="8" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><div class="n"></div></div>
      </div>`;
    }
    case 'summary':
      return `<div class="sum"><h3 data-at="0.1" data-a="up">오늘의 핵심 3가지</h3>
        <div class="sums">${sc.takeaways.map((t, j) =>
          `<div class="sumc" data-at="${(sAt(sc, 1) + j * 0.9).toFixed(3)}" data-a="pop"><div class="no">${j + 1}</div><p>${esc(t)}</p></div>`).join('')}</div></div>`;
    case 'outro': {
      const last = TL.no === TL.total;
      return `<div class="outro">
        <div class="big" data-at="0.15" data-a="pop">${last ? '수고하셨습니다 🎉' : '오늘도 수고하셨어요!'}</div>
        <div class="sub" data-at="0.4" data-a="up">EP.${String(TL.no).padStart(2, '0')} ${esc(TL.title)} 완료${last ? ' · 전 과정 수료' : ` · 다음 영상: EP.${String(TL.no + 1).padStart(2, '0')}`}</div>
        <div class="warn" data-at="${at(0)}" data-a="up">⚠️ <b>안내 전 꼭 확인하세요</b><br>보장 범위·지급 조건·한도는 보험사와 상품, 가입 시기에 따라 다릅니다.<br>반드시 해당 상품의 약관과 상품설명서를 확인하세요.</div>
      </div>`;
    }
  }
}

function visualHTML(v) {
  const t = j => (0.6 + j * 0.45).toFixed(2);
  if (v.type === 'bars') return `<div class="vb">${v.items.map((it, j) =>
    `<div class="row" data-at="${t(j)}" data-a="left"><div class="rl">${esc(it.label)}</div><div class="tr"><div class="fl" data-at="${(+t(j) + 0.3).toFixed(2)}" data-a="grow" data-grow="${it.value}">${esc(it.text)}</div></div></div>`).join('')}</div>`;
  if (v.type === 'timeline') return `<div class="tl">${v.items.map((it, j) =>
    `<div class="seg ${it.tone}" data-at="${t(j)}" data-a="pop"><b>${esc(it.text)}</b><span>${esc(it.label)}</span></div>`).join('')}<div class="axis" data-at="0.5" data-a="up"></div></div>`;
  if (v.type === 'treat') return `<div class="tg ${v.items.length === 3 ? 'n3' : ''}">${v.items.map((it, j) =>
    `<div class="tc" data-at="${t(j)}" data-a="pop"><div class="ti">${it.icon}</div><div><b>${esc(it.name)}</b><span>${esc(it.text)}</span></div></div>`).join('')}</div>`;
  if (v.type === 'check') return `<div class="ck">${v.items.map((it, j) =>
    `<div class="r ${it.ok}" data-at="${t(j)}" data-a="left"><span>${esc(it.label)}</span><span class="bd">${{ y: '✓ 보장', n: '✗ 보장 안 됨', m: '△ 상품마다' }[it.ok]}</span></div>`).join('')}</div>`;
  if (v.type === 'levels') return `<div class="lv">${v.items.map((it, j) =>
    `<div class="col"><div class="bar" data-at="${t(j)}" data-a="rise" style="height:${it.value * 0.82}%;background:color-mix(in srgb, var(--c) ${Math.round(40 + 60 * it.value / 100)}%, white)">${it.text ? `<em>${esc(it.text)}</em>` : ''}</div><div class="ll">${esc(it.label)}</div></div>`).join('')}</div>`;
  if (v.type === 'flow') return `<div class="fw">${v.items.map((it, j) =>
    `${j ? `<div class="fa" data-at="${(+t(j) - 0.2).toFixed(2)}" data-a="up">→</div>` : ''}<div class="fs" data-at="${t(j)}" data-a="pop"><div class="fi">${it.icon}</div><b>${esc(it.label)}</b><span>${esc(it.sub)}</span></div>`).join('')}</div>`;
  return '';
}

function compareHTML(sc) {
  const c = sc.compare, at = k => sAt(sc, k);
  if (c.type === 'bars') {
    return `<div class="bars">${c.items.map((it, j) => {
      const t0 = (at(1) + j * 0.7).toFixed(3);
      return `<div class="bar-row" data-at="${(at(0) + j * 0.3).toFixed(3)}" data-a="left">
        <div class="bl">${esc(it.label)}</div>
        <div class="track"><div class="fill ${it.value < 50 ? 'low' : ''}" data-grow="${it.value}" data-at="${t0}" data-a="grow">${it.value >= 30 ? esc(it.text) : ''}</div>
        ${it.value < 30 ? `<div class="bt" style="left:${it.value + 2}%" data-at="${(+t0 + 0.6).toFixed(3)}" data-a="up">${esc(it.text)}</div>` : ''}</div>
      </div>`;
    }).join('')}</div>`;
  }
  if (c.type === 'nested') {
    const shades = [0.16, 0.34, 1];
    return `<div class="nest">${c.groups.map((g, gi) => {
      const base = at(gi + 1);
      const sizes = g.rings.length === 3 ? [[720, 480], [560, 340], [400, 200]] : [[620, 480], [440, 300]];
      const rings = g.rings.map((name, k) => {
        const strong = k === g.rings.length - 1;
        const bg = strong ? 'var(--c)' : `color-mix(in srgb, var(--c) ${Math.round(shades[k + (3 - g.rings.length)] * 100)}%, white)`;
        return { name, bg, strong, w: sizes[k][0], h: sizes[k][1], at: (base + k * 0.6).toFixed(3) };
      });
      // 바깥 → 안쪽 순으로 중첩
      let html = '';
      for (let k = rings.length - 1; k >= 0; k--) {
        const r = rings[k];
        html = `<div class="ring" data-at="${r.at}" data-a="pop" style="width:${r.w}px;height:${r.h}px;background:${r.bg};color:${r.strong ? '#fff' : 'var(--ink)'}"><span>${esc(r.name)}</span>${html}</div>`;
      }
      return `<div class="ngroup"><div class="gl" data-at="${(base - 0.2).toFixed(3)}" data-a="up">${esc(g.label)}</div>${html}</div>`;
    }).join('')}</div>`;
  }
  if (c.type === 'split') {
    return `<div class="split">
      <div class="total" data-at="${at(0).toFixed(3)}" data-a="up">💳 낸 병원비 ${esc(c.total)}</div>
      <div class="stack" data-at="${at(0).toFixed(3)}" data-a="up">${c.parts.map((p, j) =>
        `<div class="seg" data-grow="${p.value}" data-at="${(at(1) + j * 0.9).toFixed(3)}" data-a="grow" style="background:${j ? '#94A3B8' : 'var(--c)'}"><b>${esc(p.text)}</b><span>${esc(p.label)}</span></div>`).join('')}</div>
      <div class="note" data-at="${at(2).toFixed(3)}" data-a="up">※ 급여 항목은 자기부담 20% · 최소 자기부담금 조건은 약관 확인</div>
    </div>`;
  }
  if (c.type === 'split2') {
    const col = (s, cls, t) => `<div class="vc ${cls}" data-at="${t.toFixed(3)}" data-a="pop"><div class="vh">${esc(s.label)}</div><ul>${s.lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
    return `<div class="vs">${col(c.left, '', at(1))}<div class="mid" data-at="${(at(1) + 0.3).toFixed(3)}" data-a="pop">VS</div>${col(c.right, 'r', at(2))}</div>`;
  }
  if (c.type === 'steps') {
    const hs = [300, 420, 540], op = [0.45, 0.72, 1];
    return `<div class="steps">${c.steps.map((s, j) =>
      `<div class="step" data-at="${(at(1) + j * 0.8).toFixed(3)}" data-a="rise" style="height:${hs[j]}px;background:color-mix(in srgb, var(--c) ${op[j] * 100}%, white)"><b>${esc(s.label)}</b><span>${esc(s.text)}</span></div>`).join('')}</div>`;
  }
  return '';
}

// 결정적 애니메이션: 시간 t 를 주면 그 순간의 화면을 그린다.
const clamp = x => Math.max(0, Math.min(1, x));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeBack = x => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function applyAnim(el, lt) {
  const at = +el.dataset.at, kind = el.dataset.a;
  const dur = kind === 'grow' ? 1.1 : kind === 'rise' ? 0.8 : 0.6;
  const p = clamp((lt - at) / dur);
  const moving = p > 0 && p < 1;
  if (kind === 'grow') {
    el.style.opacity = p > 0 ? 1 : 0;
    el.style.width = (+el.dataset.grow * easeOut(p)) + '%';
    return moving;
  }
  const e = easeOut(p);
  el.style.opacity = e;
  if (kind === 'up') el.style.transform = `translateY(${(1 - e) * 40}px)`;
  else if (kind === 'left') el.style.transform = `translateX(${(1 - e) * -60}px)`;
  else if (kind === 'pop') el.style.transform = `scale(${0.82 + 0.18 * easeBack(p)})`;
  else if (kind === 'rise') el.style.transform = `scaleY(${easeOut(p)})`;
  return moving;
}

window.setup = function (tl) {
  TL = tl;
  const r = document.documentElement.style;
  r.setProperty('--c', tl.color);
  r.setProperty('--c-soft', tl.color + '22');
  document.getElementById('ep').textContent = `EP.${String(tl.no).padStart(2, '0')} ${tl.title}`;
  const host = document.getElementById('scenes');
  host.innerHTML = tl.scenes.map((sc, i) => `<div class="scene" id="sc${i}">${sceneHTML(sc, i)}</div>`).join('');
  SCN = tl.scenes.map((sc, i) => ({ sc, el: document.getElementById('sc' + i), anim: [...document.querySelectorAll(`#sc${i} [data-at]`)] }));
  return document.fonts.ready.then(() => true);
};

window.render = function (t) {
  let i = SCN.length - 1;
  while (i > 0 && t < SCN[i].sc.start) i--;
  if (i !== CUR) { SCN.forEach((s, j) => s.el.classList.toggle('on', j === i)); CUR = i; }
  const { sc, el, anim } = SCN[i];
  const lt = t - sc.start;

  // 장면 전환: 끝 0.35초 페이드아웃
  const out = clamp((sc.dur - lt) / 0.35);
  const inn = clamp(lt / 0.2);
  el.style.opacity = Math.min(out, inn);
  let moving = out < 1 || inn < 1;
  anim.forEach(a => { if (applyAnim(a, lt)) moving = true; });

  // 퀴즈 타이머 & 오답 흐리게
  if (sc.type === 'quiz') {
    const tm = document.getElementById('timer' + i);
    const ans = sAt(sc, 2), think = sc.thinkAt;
    const on = lt >= think && lt < ans + 0.3;
    if (on || (lt >= ans && lt < ans + 0.5)) moving = true;
    tm.style.opacity = on ? 1 : 0;
    const left = Math.max(0, ans - lt);
    tm.querySelector('.n').textContent = Math.ceil(left) || '';
    tm.querySelector('.arc').style.strokeDashoffset = 276.5 * (1 - left / (ans - think));
    sc.quiz.options.forEach((_, j) => {
      const o = document.getElementById(`opt${i}_${j}`);
      const rev = clamp((lt - ans) / 0.5);
      if (j === sc.quiz.answer) {
        o.style.borderColor = rev > 0 ? 'var(--ok)' : '';
        o.style.background = rev > 0 ? `rgba(18,183,106,${0.08 * rev})` : '';
      } else if (rev > 0) {
        o.style.opacity = Math.min(+o.style.opacity, 1 - 0.55 * rev);
      }
    });
  }

  // 자막: 현재 문장
  let cap = '';
  for (const s of sc.sentences) if (lt >= s.at - 0.15) cap = s.text;
  const capEl = document.getElementById('cap');
  if (capEl.textContent !== cap) capEl.textContent = cap;

  // 진행바 (2px 단위)
  const px = Math.round(t / TL.duration * 960) * 2;
  document.getElementById('prog').style.width = px + 'px';

  // 화면이 이전 프레임과 같으면 같은 키를 돌려준다 (렌더러가 캡처를 재사용)
  return moving ? 'm' + t : `${i}|${cap}|${px}`;
};
</script>
</body>
</html>
