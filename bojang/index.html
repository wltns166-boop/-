<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TOPS 보장분석</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* Layout: 고정 상단바 + 고객목록/작업공간 단일 컬럼, 작업공간은 탭(전·후·비교·질환·출력). 출력물은 A4 흰 지면. */
:root{
  --bg:#12110f; --panel:#1b1916; --panel2:#23201c; --line:#35302a; --line2:#4a4339;
  --fg:#ede7dc; --muted:#a39a89; --dim:#776f61;
  --gold:#cfa95e; --gold-dim:#8c7442; --gold-ink:#1a1408;
  --up:#79c393; --down:#e8806f; --warn:#e3b456;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-disp:"Noto Serif KR","Apple Myungjo","Batang",serif;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num,.tab-n,td,th{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{text-wrap:balance;margin:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel2);padding:7px 14px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold-dim)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{color:var(--down)}
.btn.bnv,.btn.bnv:hover,.btn.bnv:not(.pri):hover{background:#1f2a5c!important;border-color:#1f2a5c!important;color:#fff!important}
.cfgi{display:flex;align-items:center;justify-content:space-between;gap:6px}
.cfgcol{display:inline-flex;align-items:center;gap:3px;flex:none}
.cfgcol input[type=color],#colAllPick{width:26px;height:20px;padding:0;border:1px solid var(--line);background:none;cursor:pointer}
.pg .cov td:first-child{border-left:1px solid var(--hair)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.in{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:8px 10px;width:100%}
.in:focus{border-color:var(--gold)}
label.f{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-disp);font-size:20px;color:var(--gold);letter-spacing:.06em}
.brand span{font-size:13px;color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;align-items:center}
.nav .who{font-size:12.5px;color:var(--muted);margin-right:8px}

/* login */
.login{min-height:80vh;display:grid;place-items:center}
.login .card{width:min(400px,100%);padding:30px;display:grid;gap:14px}
.login h1{font-family:var(--f-disp);font-size:26px;color:var(--gold);letter-spacing:.04em}
.err{color:var(--down);font-size:13px;min-height:1em}

/* list */
.page{padding-top:22px;display:grid;gap:18px}
.ph{display:flex;align-items:end;gap:12px;flex-wrap:wrap}
.ph h2{font-family:var(--f-disp);font-size:24px}
.ph .row{margin-left:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line)}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel2)}
.tscroll{overflow-x:auto}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}
.pill.gold{border-color:var(--gold-dim);color:var(--gold)}
.pill.red{border-color:#7a3a30;color:var(--down)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:6px}

/* workspace */
.custhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}
.tabs button .tab-n{font-size:11px;color:var(--dim);margin-left:4px}
.save{font-size:12px;color:var(--dim);margin-left:auto}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;display:grid;gap:8px;cursor:pointer}
.drop.over{border-color:var(--gold);background:var(--panel2)}
.drop strong{font-size:15px}
.jobs{display:grid;gap:4px;font-size:13px}
.jobs .j{display:flex;gap:8px;align-items:center}
.jobs .j .s{margin-left:auto;color:var(--muted)}
.jobs .j.ok .s{color:var(--up)} .jobs .j.bad .s{color:var(--down)}
.spin{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}

/* coverage grid */
.gridwrap{overflow:auto;max-height:72vh;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;height:30px}
.grid thead th{position:sticky;top:0;z-index:3;background:var(--panel2);padding:8px;vertical-align:top;text-align:left;min-width:150px;font-weight:500}
.grid thead th.c-grp,.grid thead th.c-lbl,.grid thead th.c-sum{min-width:0}
.grid .c-grp{position:sticky;left:0;z-index:2;background:var(--panel2);width:52px;min-width:52px;text-align:center;font-size:12px;color:var(--gold);font-weight:600;padding:4px}
.grid .c-lbl{position:sticky;left:52px;z-index:2;background:var(--panel);width:150px;min-width:150px;padding:0 8px;white-space:nowrap}
.grid .c-sum{position:sticky;left:202px;z-index:2;background:var(--panel2);width:92px;min-width:92px;text-align:right;padding:0 8px;font-weight:600}
.grid thead .c-grp,.grid thead .c-lbl,.grid thead .c-sum{z-index:4}
.grid tr.key .c-lbl{color:var(--fg)} .grid tr:not(.key) .c-lbl{color:var(--muted)}
.grid tr.miss .c-sum{color:var(--down)}
.grid tr.meta td,.grid tr.meta .c-lbl{background:var(--panel2)}
.grid td.cell{position:relative;min-width:150px}
.grid td.cell input.num{width:100%;height:30px;background:transparent;border:0;text-align:right;padding:0 8px}
.grid td.cell input.num:focus{background:var(--bg);outline:1px solid var(--gold);outline-offset:-1px}
.grid td.cell input.txt{width:100%;height:30px;background:transparent;border:0;padding:0 8px}
.grid td.cell input.txt:focus{background:var(--bg);outline:1px solid var(--gold);outline-offset:-1px}
.grid td.ro{text-align:right;padding:0 8px;color:var(--muted);background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.015) 6px 12px)}
.grid td.ro.l{text-align:left}
.grid .auto{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10.5px;color:var(--gold);pointer-events:none}
.ph-pol{display:grid;gap:4px}
.ph-pol .co{font-weight:600;color:var(--fg)}
.ph-pol .pr{font-size:11.5px;color:var(--muted);white-space:normal;max-width:180px}
.ph-pol .acts{display:flex;gap:4px;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;cursor:pointer}
.chk input{accent-color:var(--gold)}
.unm{display:grid;gap:6px}
.unm .u{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(140px,200px);gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.unm .u select{padding:4px 6px}
.keeplist{display:grid;gap:6px}
.keeplist label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.keeplist label.on{border-color:var(--gold-dim);background:var(--panel2)}

/* compare */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:22px;font-weight:600;margin-top:2px}
.tile .d{font-size:12.5px;margin-top:2px}
.up{color:var(--up)} .down{color:var(--down)}
.cmp td.n,.cmp th.n{text-align:right}
.cmp td.g{color:var(--gold);font-size:12px;white-space:nowrap}
.scen{display:grid;align-items:start;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px}
.scen .card{padding:0;overflow:hidden}
.scen .sh{display:flex;align-items:baseline;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.scen .sh h3{font-size:16px}
.scen .sh .tot{margin-left:auto;font-size:13px}
.scen table{width:100%;border-collapse:collapse;font-size:13px}
.scen td,.scen th{padding:7px 16px;border-bottom:1px solid var(--line)}
.scen th{font-weight:500;color:var(--muted);font-size:12px;text-align:left}
.scen .n{text-align:right;white-space:nowrap}
.scen tr.total td{font-weight:700;background:var(--panel2)}
.journey{display:grid;gap:14px}
.jrow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:stretch}
.jrow .dz{display:grid;place-items:center;background:var(--panel2);border:1px solid var(--gold-dim);border-radius:8px;font-family:var(--f-disp);font-size:18px;color:var(--gold)}
.jsteps{display:flex;gap:0;overflow-x:auto}
.jstep{flex:1 0 150px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;position:relative;margin-right:18px}
.jstep:not(:last-child)::after{content:"";position:absolute;right:-14px;top:50%;width:10px;height:10px;border-top:2px solid var(--gold-dim);border-right:2px solid var(--gold-dim);transform:translateY(-50%) rotate(45deg)}
.jstep .t{font-weight:600;font-size:13px;margin-bottom:6px}
.jstep .ba{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.jstep .ba span:nth-child(odd){color:var(--dim)}
.jstep .ba span:nth-child(even){text-align:right}

.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px}
.pgrid .pk{font-size:13px;font-weight:600;margin-bottom:8px}
.pbar{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
.pbar .pl{color:var(--muted)}
.pbar .pt{height:16px;background:var(--panel2);border-radius:3px;overflow:hidden}
.pbar .pt i{display:block;height:100%;border-radius:3px}
.pbar.b .pt i{background:#6b6355} .pbar.a .pt i{background:var(--gold)}
.pbar .pval{font-weight:600;min-width:110px;text-align:right}
.pgrid .pd{font-size:12.5px;text-align:right;margin-top:2px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mth{display:grid;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;position:relative;background:var(--bg)}
.mth.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mth input{position:absolute;top:12px;left:12px;accent-color:var(--gold);width:18px;height:18px}
.mth img{width:100%;aspect-ratio:1/1.29;object-fit:contain;background:#fff;border-radius:4px}
.mth span{font-size:12.5px;line-height:1.35}
.mth .btn{justify-self:start}
.mv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out;gap:8px;align-content:center}
.mv img{max-height:86vh;max-width:100%;border-radius:6px}
.cm{position:fixed;inset:0;z-index:70}
.cm .cmbg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.cm .cmbox{position:relative;margin:5vh auto 0;width:min(980px,94vw);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.cm .cmhd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.cm .cmhd h2{margin:2px 0 0;font-size:18px}
.cm .cmbody{overflow:auto;padding:0}
.cm .cmbody .tbl{width:100%}
.cm tr.cur td{background:rgba(201,162,77,.12)}
.cm .cmft{padding:10px 18px;border-top:1px solid var(--line);font-size:12px}

.mv span{color:#ddd;font-size:13px;text-align:center}
.jb{display:inline-block;min-width:38px;padding:2px 8px;border-radius:99px;font-weight:700;font-size:12.5px;color:#1a1408}
.jb.j1{background:#d9d2c3}.jb.j2{background:#e6cf9a}.jb.j3{background:#d9b25f}.jb.j4{background:#c98c3e;color:#fff}.jb.j5{background:#b4532f;color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.bth{display:grid;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px;cursor:zoom-in;text-align:left}
.bth:hover{border-color:var(--gold-dim)}
.bth img{width:100%;aspect-ratio:794/1123;object-fit:cover;border-radius:4px;background:#fff}
.bth span{font-size:12px;color:var(--muted);line-height:1.35}
.cfgg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 18px}
.cfgc{display:grid;gap:4px;align-content:start}
.cfgc .chk{font-size:13px}
/* print preview */
.pv{display:grid;gap:20px;justify-items:center;background:#2a2723;border-radius:10px;padding:20px 10px;overflow:hidden}
.pvbox{box-shadow:0 6px 24px rgba(0,0,0,.45)}
#stage{position:fixed;left:-20000px;top:0;width:794px;pointer-events:none}

/* A4 page (print) — 흰 지면, 가는 가로선, 금색은 강조에만 */
.pg{--ink:#1d1b18;--sub:#6e675b;--hair:#e4ded2;--band:#f7f3ea;--gold:#9a7631;--goldbar:#b98f3f;--graybar:#d3cdc1;--pos:#1f7a45;--neg:#b3261e;
  width:794px;height:1123px;background:#fff;color:var(--ink);font-family:var(--f-ui);padding:40px 44px 30px;display:flex;flex-direction:column;position:relative;overflow:hidden;line-height:1.3}
.pg .hd{display:flex;align-items:flex-end;gap:16px;padding-bottom:12px;border-bottom:1.5px solid var(--ink)}
.pg .hd .ttl{display:grid;gap:3px}
.pg .hd .ttl small{font-size:10px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.pg .hd h1{font-family:var(--f-disp);font-size:22px;margin:0;font-weight:700}
.pg .hd h1 span{font-family:var(--f-ui);font-weight:500;font-size:13px;color:var(--sub);margin-left:8px}
.pg .hd .dt{margin-left:auto;font-size:10px;color:var(--sub);text-align:right;line-height:1.5}
.pg .hd .dt b{font-family:var(--f-disp);color:var(--gold);font-size:13px;letter-spacing:.1em;display:block}
.pg .ft{margin-top:auto;padding-top:8px;border-top:1px solid var(--hair);font-size:8.5px;color:var(--sub);display:flex;justify-content:space-between;gap:10px}
.pg table{border-collapse:collapse;width:100%;table-layout:fixed}
.pg .pos{color:var(--pos)} .pg .neg{color:var(--neg)}
.pg h2.st{font-size:13px;margin:22px 0 8px;display:flex;gap:8px;align-items:baseline;font-weight:700}
.pg h2.st small{font-weight:400;color:var(--sub);font-size:9.5px}
.pg .note{font-size:9px;color:var(--sub);margin-top:10px;line-height:1.5}
/* 요약 */
.pg .kpi{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:20px;border:1px solid var(--hair)}
.pg .kpi div{padding:14px 16px}
.pg .kpi div+div{border-left:1px solid var(--hair)}
.pg .kpi small{display:block;font-size:10px;color:var(--sub);margin-bottom:4px}
.pg .kpi b{font-size:21px;font-weight:700}
.pg .kpi .hl{background:var(--band)}
.pg .bars{display:grid;gap:12px}
.pg .bar{display:grid;grid-template-columns:148px 1fr 92px;gap:12px;align-items:center}
.pg .bar .nm{font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.pg .bar .tr{display:grid;gap:3px}
.pg .bar .ln{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--sub)}
.pg .bar .ln i{display:block;height:11px;border-radius:2px;min-width:2px}
.pg .bar .ln.b i{background:var(--graybar)} .pg .bar .ln.a i{background:var(--goldbar)}
.pg .bar .ln.a{color:var(--ink);font-weight:700}
.pg .bar .df{text-align:right;font-size:11.5px;font-weight:700}
.pg .legend{display:flex;gap:14px;font-size:9.5px;color:var(--sub);margin-left:auto}
.pg .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.pg .chips{display:flex;flex-wrap:wrap;gap:5px}
.pg .chips span{font-size:10px;padding:3px 9px;border-radius:99px;border:1px solid var(--hair)}
.pg .chips.ok span{border-color:#b7d8c2;background:#eef7f1;color:var(--pos)}
.pg .chips.no span{border-color:#efc4bd;background:#fcf0ee;color:var(--neg)}
.pg .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pg .prem2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.pg .prem2 .pc{border:1px solid var(--hair);border-radius:4px;padding:12px 14px;display:grid;gap:6px}
.pg .prem2 small{font-size:10.5px;font-weight:700;color:var(--ink)}
.pg .prem2 .tr{display:grid;gap:5px}
.pg .prem2 .ln{display:flex;align-items:center;color:var(--sub)}
.pg .prem2 .ln i{display:block;border-radius:2px}
.pg .prem2 .ln.b i{background:var(--graybar)} .pg .prem2 .ln.a i{background:var(--goldbar)}
.pg .prem2 .ln.a b{color:var(--ink)}
.pg .prem2 .df{text-align:right;font-size:12px;font-weight:700}
/* 보장분석표 */
.pg .cov{margin-top:14px}
.pg .cov td,.pg .cov th{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:400}
.pg .cov .g{text-align:center;font-weight:700;white-space:normal;color:var(--gold);border-right:1px solid var(--hair);line-height:1.15}
.pg .cov tr.gs td{border-top:1.2px solid #bfb6a4}
.pg .cov .l{text-align:left}
.pg .cov .s{text-align:right;font-weight:700;background:var(--band)}
.pg .cov .v{text-align:right}

async function boot(){
  const use=n=>(window.claude&&window.claude.use)?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  [S.db,S.user,S.sample,S.dl]=await Promise.all([use('db'),use('user'),use('sample'),use('downloads')]);
  if(!S.db){S.view='nodb';return render()}
  if(CFG.externalUser){const u=typeof CFG.externalUser==='function'?await CFG.externalUser():CFG.externalUser;if(u&&u.sabun){S.external=true;return enter({sabun:String(u.sabun),name:u.name||String(u.sabun),role:u.role==='admin'?'admin':'fc'})}}
  try{
    const snap=await S.db.collection(EMP).limit(1).get();
    if(snap.empty){S.canSetup=S.user?((await S.user.isOwner().catch(()=>false))||(await S.user.canEdit().catch(()=>false))):true;S.view='setup';return render()}
  }catch(e){S.view='nodb';return render()}

  if(sab){const d=await S.db.doc(EMP+'/'+sab).get().catch(()=>null);if(d&&d.exists&&d.data().active!==false){return enter(d.data())}}

}

  S.hidden=new Set();S.shown=new Set();S.col={};S.colOn=true;S.db.doc(P.pref+'/'+emp.sabun).get().then(d=>{if(d.exists){S.hidden=new Set(d.data().hidden||[]);S.shown=new Set(d.data().shown||[]);S.col=colClean(d.data().col);S.colOn=d.data().colOn!==false;if(S.cur)renderTab()}}).catch(()=>{});
  S.unsubJ=S.db.doc(P.jong).onSnapshot(d=>{S.jongCfg=d.exists?d.data():null;if(S.view==='admin')renderMain()},()=>{});
  S.unsubL=S.db.doc(P.dict).onSnapshot(d=>{S.learn=d.exists?(d.data().map||{}):{}},()=>{});

}

/* 항목 색칠 (v2026.11.13-9 박지순 요청): 항목마다 색 지정 — 입력된 값은 그 칸만, 미입력(합계 0) 줄은 줄 전체 */
const COL_DEF='#fff1a8';
function colClean(o){const r={};if(o&&typeof o==='object')for(const k in o){if(ITEM[k]&&/^#[0-9a-fA-F]{6}$/.test(String(o[k])))r[k]=String(o[k]).toLowerCase()}return r}
function colOf(k){return S.colOn!==false&&S.col&&S.col[k]?S.col[k]:''}
function paintGrid(cols){

    const cells=tds.filter(td=>td.classList.contains('cell')||td.classList.contains('ro'));cells.forEach((td,i)=>{const p=cols[i];if(p&&eff(p,k))td.style.background=c})});
}

function insAge(){const m=String(S.cur.birth||'').match(/(\d{4})\D?(\d{2})\D?(\d{2})/);if(!m)return null;const b=new Date(+m[1],+m[2]-1,+m[3]),n=new Date();let mo=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth()-(n.getDate()<b.getDate()?1:0);return Math.floor(mo/12)+(mo%12>=6?1:0)}
function limAmt(s){const m=s.match(/(\d[\d,.]*)\s*(억|천)?(?:\s*(\d+)천)?/);if(!m)return null;let v=parseFloat(m[1].replace(/,/g,''));if(m[2]==='억')v=v*10000+(m[3]?+m[3]*1000:0);else if(m[2]==='천')v*=1000;return v}
function limParse(text,age,silson){
  if(!text)return{t:'자료 없음'};const main=text.split('*')[0].trim();
  if(/^無/.test(main))return{none:true,t:text};if(/업계\d건|당타사|당사한도|입원기준|피보험자/.test(main)&&!/^\(?[~\d]/.test(main))return{t:text};
  const segs=main.split('/');let seg=segs[0];
  if(age!=null&&segs.length>1){const rng=s=>{let m;if(m=s.match(/\((\d+)~(\d+)세\)/))return[+m[1],+m[2]];if(m=s.match(/\(~(\d+)세\)/))return[0,+m[1]];if(m=s.match(/\((\d+)세~\)/))return[+m[1],999];return null};
    const hit=segs.find(s=>{const r=rng(s);return r&&age>=r[0]&&age<=r[1]});if(hit)seg=hit}
  if(/업계\d건/.test(seg))return{t:text};
  const s2=seg.replace(/\([^)]*세[^)]*\)/g,'').replace(/^[^\d]*/,'').replace(/^\d+급/,'');const p=s2.match(/^(\d[\d,.]*\s*(?:억|천)?(?:\s*\d+천)?)\s*(?:\((\d+)\))?/);if(!p)return{t:text};
  let v=limAmt(p[1]);if(silson&&p[2])v=+p[2];return{v,t:text}}

async function pdfRead(file,password){
  const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer()),cMapUrl:'cmaps/',cMapPacked:true,CMapReaderFactory:KCMapFactory,isEvalSupported:false,...(password?{password}:{})}).promise;

  for(let i=1;i<=pdf.numPages;i++){
    const pg=await pdf.getPage(i);const tc=await pg.getTextContent();const lines=[];
    for(const it of tc.items){if(!it.str||!it.str.trim())continue;const y=it.transform[5],x=it.transform[4];let ln=lines.find(l=>Math.abs(l.y-y)<3);if(!ln){ln={y,its:[]};lines.push(ln)}ln.its.push({x,w:it.width||0,s:it.str})}
    lines.sort((a,b)=>b.y-a.y);
    const txt=lines.map(l=>{l.its.sort((a,b)=>a.x-b.x);let s='',end=null;for(const t of l.its){if(end!=null){const gap=t.x-end;s+=gap>14?' | ':gap>1.5?' ':''}s+=t.s;end=t.x+t.w}return s}).join('\n');
    chars+=txt.replace(/\s/g,'').length;out.push(`=== ${i}쪽 ===\n${txt}`);

  return{pdf,text:out.join('\n'),chars,pages:pdf.numPages};

  const blobs=[];for(let i=1;i<=Math.min(pdf.numPages,max);i++){const pg=await pdf.getPage(i);const v0=pg.getViewport({scale:1});const sc=Math.min(2.2,1500/v0.width);const vp=pg.getViewport({scale:sc});
    const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    blobs.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)))}
  return blobs;
}

/* 기본값: 지점 제안서 실제 금액 평균(10만원 단위 반올림) — 생명 1~5종 2건, 손보 1~5종 31건, 손보 1~7종 4건 */
const JONG_DEF={life:[20,30,80,430,700],nl5:[20,40,100,440,770],nl7:[20,20,30,100,300,500,1000]};
function jongCfg(){const c=S.jongCfg||{};const ok=(a,n)=>Array.isArray(a)&&a.length===n;return{life:ok(c.life,5)?c.life:JONG_DEF.life,nl5:ok(c.nl5,5)?c.nl5:JONG_DEF.nl5,nl7:ok(c.nl7,7)?c.nl7:JONG_DEF.nl7}}
function covAssign(c,company){
  const n=window.COVDICT?COVDICT.norm(c.name):c.name;
  if(S.learn&&Object.prototype.hasOwnProperty.call(S.learn,n)){const k=S.learn[n];return{key:k&&ITEM[k]?k:'',src:'learn',agg:'sum'}}
  const d=window.COVDICT?COVDICT.lookup(c.name):undefined;
  if(d&&d.silson)return{silson:true};
  if(d&&d.jongAll){const life=/생명|라이프|life/i.test(company||'');const n=life?5:(d.n||5);const keys=Array.from({length:n},(_,i)=>d.side+(i+1));return{key:keys.join('+'),src:'dict',agg:'jong',jn:n,sch:life?'life':n===7?'nl7':'nl5'}}
  if(d&&d.k===null)return{key:'',src:'dict',agg:'sum'};
  if(d&&d.k)return{key:d.k.join('+'),src:'dict',agg:d.agg};
  return{key:ITEM[c.key]?c.key:'',src:ITEM[c.key]?'ai':'none',agg:'sum'};
}
function covValues(cov){
  const sum={},mx={};
  const jc=jongCfg();for(const c of cov||[]){if(!c.key)continue;if(c.agg==='jong'){const sch=jc[c.sch]||(c.jn===7?jc.nl7:jc.nl5);c.key.split('+').forEach((k,i)=>{if(ITEM[k]&&sch[i])sum[k]=(sum[k]||0)+num(sch[i])});continue}const a=num(c.amount);for(const k of c.key.split('+')){if(!ITEM[k])continue;if(c.agg==='max')mx[k]=Math.max(mx[k]||0,a);else sum[k]=(sum[k]||0)+a}}
  for(const k in mx)sum[k]=(sum[k]||0)+mx[k];
  for(const k in sum)sum[k]=r2(sum[k]);return sum;
}
async function recognize(files,mode){

  if(!window.pdfjsLib)return toast('PDF 읽기 도구를 불러오지 못했습니다. 새로고침해 주세요.');
  for(const f of pdfs){const job={id:uid('j'),name:f.name,file:f,mode,st:'run',msg:'PDF 읽는 중…'};S.jobs[mode].unshift(job);updJobs(mode);await processJob(job)}
}
async function processJob(job,pw){
  const mode=job.mode,f=job.file;job.st='run';job.msg='PDF 읽는 중…';updJobs(mode);
  try{
    let r;
    try{r=await pdfRead(f,pw)}catch(e){if(e&&e.name==='PasswordException'){job.st='pw';job.msg=pw?'비밀번호가 맞지 않습니다':'비밀번호가 걸린 PDF입니다';updJobs(mode);return}throw e}
    if(!S.sample){job.st='bad';job.msg='자동 인식 불가 — 직접 입력하세요';updJobs(mode);return}
    let imgs=null;let text=r.text;
    if(r.chars<r.pages*40){const lim=await S.sample.limits().catch(()=>null);
      if(lim&&lim.images){job.msg='스캔 문서 — 이미지로 분석 준비 중…';updJobs(mode);imgs=await pdfImages(r.pdf,Math.min(lim.images.maxCount||8,20))}
      else if(r.chars<20){job.st='bad';job.msg='글자를 읽을 수 없는 스캔 PDF입니다';updJobs(mode);return}}
    const enc=new TextEncoder();while(enc.encode(text).length>230000)text=text.slice(0,Math.floor(text.length*.85));
    job.msg='AI가 담보를 읽는 중… (30초~1분)';updJobs(mode);
    const res=await S.sample.json(aiPrompt(text,mode,!!imgs),{modelTier:'complex',...(imgs?{images:imgs}:{})});
    const st=applyResult(res,mode,f.name);
    job.st='ok';job.msg=`${st.n}건 · 담보 ${st.cov}개 (미분류 ${st.none})`;job.file=null;
    logHist(`${mode==='before'?'기존보험':'제안서'} PDF 인식: ${f.name} (${st.n}건)`);
    markDirty();renderTab();
  }catch(e){job.st='bad';const c=e&&e.code;job.msg=c==='not_granted'?'Claude 사용 허용이 필요합니다':c==='rate_limited'?'요청이 많습니다. 잠시 후 다시 시도':c==='invalid_json'?'결과를 해석하지 못했습니다. 다시 올려주세요':c==='usage_limit'?'사용량 한도에 도달했습니다':('오류: '+(e&&(e.message||c)||e));updJobs(mode)}
}
function applyResult(res,mode,fname){
  const pols=Array.isArray(res?.policies)?res.policies:[];const c=S.cur;let ncov=0,nnone=0;
  if(res?.customer){if(!c.birth&&res.customer.birth)c.birth=String(res.customer.birth);if(!c.gender&&/^[남여]/.test(res.customer.gender||''))c.gender=res.customer.gender[0]}
  for(const q of pols){
    const p=newPolicy(mode);p.src='pdf';p.file=fname;p.company=String(q.company||'');p.product=String(q.product||'');p.joinDate=String(q.joinDate||'');p.premium=num(q.premium);p.payYears=num(q.payYears);p.renewal=String(q.renewal||'');p.expiry=String(q.expiry||'');p.silson=!!q.silson;p.summary=!!q.summary;
    p.cov=[];
    for(const x of(q.coverages||[])){if(!x||!x.name)continue;const a=num(x.amount);if(!a)continue;const as=covAssign(x,q.company);if(as.silson){p.silson=true;continue}
      p.cov.push({name:String(x.name),amount:a,key:as.key,src:as.src,agg:as.agg,...(as.jn?{jn:as.jn,sch:as.sch}:{})});ncov++;if(!as.key)nnone++}
    for(const[k,v]of Object.entries(q.items||{})){const n=num(v);if(n&&ITEM[k])p.cov.push({name:ITEM[k].l,amount:n,key:k,src:'ai',agg:'sum'})}
    p.values=covValues(p.cov);
    (mode==='before'?c.before:c.proposals).push(p);
  }
  return{n:pols.length,cov:ncov,none:nnone};
}

    if(ex&&(+ex.updatedAt||0)>(c.updatedAt||0)&&!confirm(`${c.name} 고객은 저장소에 더 최근 내용(${dt(ex.updatedAt)})이 있습니다. 드라이브 저장본(${dt(c.updatedAt)})으로 덮어쓸까요?`)){return renderCustModal()}
    await flushSave();if(S.cmDrvSeq!==seq||!S.cmDrv)return;
    try{await S.db.doc(P.cust+'/'+c.id).set(JSON.parse(JSON.stringify(c)))}catch(x){if(S.cmDrv)S.cmDrv.err='저장소에 넣지 못했습니다: '+(x&&x.code||x);return renderCustModal()}
    toast(ex?`${c.name} 고객을 드라이브 저장본으로 되돌렸습니다`:`${c.name} 고객을 드라이브에서 불러왔습니다`);
    S.cm=false;S.cmDrv=null;$('#custModal')?.remove();S.cur=c;S.cur.before=S.cur.before||[];S.cur.proposals=S.cur.proposals||[];S.tab='before';S.jobs={before:[],proposal:[]};S.saveMsg='저장됨';S.view='cust';window.scrollTo(0,0);return renderMain()}
  if(act==='cmNew'){await flushSave();S.cm=false;$('#custModal')?.remove();S.cur=null;S.view='list';S.showNew=true;renderMain();$('#nc_name')?.focus();return}
  if(act==='goEdu'){await flushSave();S.cur=null;S.view='edu';return renderMain()}
  if(act==='bookView'){const v=$('#bookViewer');const n=+id;v.innerHTML=`<div class="mv" data-act="bookClose"><img src="${bookSrc(n)}" alt=""><span>${n}쪽 · 아무 곳이나 누르면 닫힙니다</span></div>`;v.hidden=false;return}
  if(act==='bookClose'){$('#bookViewer').hidden=true;return}
  if(act==='goAdmin'){await flushSave();S.cur=null;S.view='admin';return renderMain()}
  if(act==='fc'){S.fcFilter=id||'';return renderMain()}
  if(act==='goFc'){S.fcFilter=id;S.view='list';return renderMain()}
  if(act==='saveJong'){const g=(p,n)=>Array.from({length:n},(_,i)=>num($('#'+p+(i+1)).value));try{await S.db.doc(P.jong).set({life:g('jl',5),nl5:g('j5',5),nl7:g('j7',7)});toast('종수술 기본금액을 저장했습니다. 새로 인식하는 PDF부터 적용됩니다')}catch(x){toast('저장하지 못했습니다')}return}
  if(act==='toggleNew'){S.showNew=!S.showNew;renderMain();if(S.showNew)$('#nc_name')?.focus();return}
  if(act==='openCust'){const c=S.custs.find(x=>x.id===id);if(!c)return;S.cur=JSON.parse(JSON.stringify(c));S.cur.before=S.cur.before||[];S.cur.proposals=S.cur.proposals||[];S.tab='before';S.jobs={before:[],proposal:[]};S.saveMsg='저장됨';S.view='cust';window.scrollTo(0,0);return renderMain()}
  if(act==='delCust'){const cid=S.cur.id;clearTimeout(S.saveT);S.dirty=false;try{window._bjDrive&&window._bjDrive.cancel(cid)}catch(x){}try{await S.db.doc(P.cust+'/'+cid).delete();toast('고객을 삭제했습니다')}catch(x){return toast('삭제하지 못했습니다')}S.cur=null;S.view='list';return renderMain()}
  if(act==='tab'){S.tab=id;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.id===id));return renderTab()}
  if(act==='addPolicy'){const p=newPolicy(id);(id==='before'?S.cur.before:S.cur.proposals).push(p);markDirty();renderTab();setTimeout(()=>{const g=$('.gridwrap');if(g)g.scrollLeft=g.scrollWidth},30);return}
  if(act==='delJob'){ // 인트라넷 통합(2026-10-28): 올린 PDF 줄 삭제 — 그 파일에서 인식된 보험도 함께 뺌
    const mode=S.jobs.before.some(x=>x.id===id)?'before':'proposal';const job=S.jobs[mode].find(x=>x.id===id);if(!job)return;
    S.jobs[mode]=S.jobs[mode].filter(x=>x.id!==id);
    const key=mode==='before'?'before':'proposals';const n0=S.cur[key].length;S.cur[key]=S.cur[key].filter(p=>!(p.src==='pdf'&&p.file===job.name));
    if(S.cur[key].length!==n0){logHist(`${mode==='before'?'기존보험':'제안서'} PDF 삭제: ${job.name} (${n0-S.cur[key].length}건)`);markDirty()}
    return renderTab()}
  if(act==='delPolicy'){S.cur.before=S.cur.before.filter(p=>p.id!==id);S.cur.proposals=S.cur.proposals.filter(p=>p.id!==id);markDirty();return renderTab()}
  if(act==='pdf')return makePdf();
  if(act==='matRec'){const set=new Set(S.cur.mats||[]);recMats().forEach(x=>set.add(x));S.cur.mats=[...set];markDirty();return renderTab()}
  if(act==='matClear'){S.cur.mats=[];markDirty();return renderTab()}
  if(act==='matView'){e.preventDefault();const v=$('#matViewer');v.innerHTML=`<div class="mv" data-act="matClose"><img src="${matSrc(id)}" alt=""><span>${esc(MAT[id].t)} · 아무 곳이나 누르면 닫힙니다</span></div>`;v.hidden=false;return}
  if(act==='matClose'){$('#matViewer').hidden=true;return}
  if(act==='itemCfg'){S.showCfg=!S.showCfg;return renderTab()}
  if(act==='colAll'){const v=($('#colAllPick')||{}).value||COL_DEF;S.col=S.col||{};Object.keys(S.col).forEach(k=>S.col[k]=v);saveHidden();return renderTab()}
  if(act==='colClear'){S.col={};saveHidden();return renderTab()}
  if(act==='cfgAll'){S.hidden=new Set();S.shown=new Set(ITEMS.filter(i=>i.extra).map(i=>i.k));saveHidden();return renderTab()}
  if(act==='covSel'){S.covSel=id;return renderTab()}
  if(act==='pdfpw'){const job=[...S.jobs.before,...S.jobs.proposal].find(j=>j.id===id);const pw=$('#pw_'+id)?.value||'';if(job&&pw)processJob(job,pw);return}
  if(act==='resetPw'){const v=$('#rp_'+id)?.value||'';if(v.length<4)return toast('새 비밀번호를 4자 이상 입력하세요');const salt=uid('s');try{await S.db.doc(EMP+'/'+id).update({salt,hash:await hashPw(salt,v)});toast('비밀번호를 바꿨습니다')}catch(x){toast('바꾸지 못했습니다: 권한을 확인하세요')}return}
  if(act==='toggleEmp'){const em=S.emps.find(x=>x.sabun===id);try{await S.db.doc(EMP+'/'+id).update({active:em.active===false})}catch(x){toast('바꾸지 못했습니다')}return}
  if(act==='delEmp'){try{await S.db.doc(EMP+'/'+id).delete();toast('사번을 삭제했습니다')}catch(x){toast('삭제하지 못했습니다')}return}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='eduQ'){S.eduQ=t.value;clearTimeout(S.eduT);S.eduT=setTimeout(()=>{const pos=t.selectionStart;renderMain();const q=$('#eduQ');if(q){q.focus();q.setSelectionRange(pos,pos)}},250);return}
  if(t.id==='q'){S.q=t.value;const pos=t.selectionStart;renderMain();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);return}
  if(!S.cur)return;
  if(t.dataset.f){S.cur[t.dataset.f]=t.value;if(t.dataset.f==='name'){const h=$('.ph h2');if(h)h.textContent=t.value+' 님'}return markDirty()}
  const p=t.dataset.pid&&[...S.cur.before,...S.cur.proposals].find(x=>x.id===t.dataset.pid);if(!p)return;
  if(t.dataset.k){const v=t.value.trim();if(v==='')delete p.values[t.dataset.k];else p.values[t.dataset.k]=num(v);updateSums();return markDirty()}
  if(t.dataset.pf){p[t.dataset.pf]=(t.dataset.pf==='premium'||t.dataset.pf==='payYears')?num(t.value):t.value;if(t.dataset.pf==='premium')updateSums();return markDirty()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fcFilter'){S.fcFilter=t.value;return renderMain()}
  if(!S.cur)return;
  if(t.dataset.f==='gender'){S.cur.gender=t.value;return markDirty()}
  if(t.dataset.upload){recognize(t.files,t.dataset.upload);t.value='';return}
  if(t.dataset.keep){const p=S.cur.before.find(x=>x.id===t.dataset.keep);p.keep=t.checked;markDirty();return renderTab()}
  if(t.dataset.pchk){const p=[...S.cur.before,...S.cur.proposals].find(x=>x.id===t.dataset.pid);p[t.dataset.pchk]=t.checked;markDirty();return renderTab()}
  if(t.dataset.cov){const[pid,i]=t.dataset.cov.split(':');const p=[...S.cur.before,...S.cur.proposals].find(x=>x.id===pid);const c=p.cov[+i];const before=covValues(p.cov);
    c.key=t.value;c.src='user';c.agg=(window.COVDICT&&COVDICT.lookup(c.name)?.agg)||'sum';const after=covValues(p.cov);
    for(const k of new Set([...Object.keys(before),...Object.keys(after)])){const v=r2(num(p.values[k])-(before[k]||0)+(after[k]||0));if(v)p.values[k]=v;else delete p.values[k]}
    learnSave(window.COVDICT?COVDICT.norm(c.name):c.name,c.key);toast(c.key?`'${c.name}' → ${c.key.split('+').map(k=>ITEM[k]?.l).join('+')}. 다음부터 자동으로 들어갑니다`:`'${c.name}'은 다음부터 분류하지 않습니다`);markDirty();return renderTab()}
  if(t.dataset.unm){const[pid,i]=t.dataset.unm.split(':');const p=[...S.cur.before,...S.cur.proposals].find(x=>x.id===pid);const u=p.unmapped[+i];const k=t.value;if(!k)return;
    if(k!=='__del'){p.values[k]=r2(num(p.values[k])+num(u.amount));toast(`'${u.name}' → ${ITEM[k].l}에 ${fmtMan(num(u.amount))}원 더했습니다`)}p.unmapped.splice(+i,1);markDirty();return renderTab()}
  if(t.dataset.act2==='onlyChanged'){S.cmpOnlyChanged=t.checked;return renderTab()}
  if(t.dataset.mat){const set=new Set(S.cur.mats||[]);t.checked?set.add(t.dataset.mat):set.delete(t.dataset.mat);S.cur.mats=[...set];t.closest('.mth')?.classList.toggle('on',t.checked);markDirty();return}
  if(t.dataset.colon){S.colOn=t.checked;saveHidden();return renderTab()}
  if(t.dataset.cchk){const k=t.dataset.cchk;S.col=S.col||{};if(t.checked){const pk=document.querySelector('[data-ccol="'+k+'"]');S.col[k]=(pk&&/^#[0-9a-f]{6}$/i.test(pk.value)?pk.value:COL_DEF).toLowerCase()}else delete S.col[k];saveHidden();return renderTab()}
  if(t.dataset.ccol){const k=t.dataset.ccol;S.col=S.col||{};if(/^#[0-9a-f]{6}$/i.test(t.value))S.col[k]=t.value.toLowerCase();saveHidden();return renderTab()}
  if(t.dataset.hide){S.hidden=S.hidden||new Set();t.checked?S.hidden.delete(t.dataset.hide):S.hidden.add(t.dataset.hide);saveHidden();return renderTab()}
  if(t.dataset.show){S.shown=S.shown||new Set();t.checked?S.shown.add(t.dataset.show):S.shown.delete(t.dataset.show);saveHidden();return renderTab()}
  if(t.dataset.hgrp){const g=GROUPS.find(x=>x[0]===t.dataset.hgrp);S.hidden=S.hidden||new Set();S.shown=S.shown||new Set();g[2].forEach(([k,,,ex])=>{if(ex){t.checked?S.shown.add(k):S.shown.delete(k)}else{t.checked?S.hidden.delete(k):S.hidden.add(k)}});saveHidden();return renderTab()}
  if(t.dataset.pr){S.pr[t.dataset.pr]=t.checked;return renderPreview()}
});
['dragover','dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{
  const d=e.target.closest&&e.target.closest('[data-drop]');if(!d)return;e.preventDefault();
  if(ev==='dragover')d.classList.add('over');else d.classList.remove('over');
  if(ev==='drop')recognize(e.dataTransfer.files,d.dataset.drop);
}));
document.addEventListener('toggle',e=>{const d=e.target;if(d.tagName==='DETAILS'&&d.dataset.step&&d.open&&S.eduOpen!==+d.dataset.step){S.eduOpen=+d.dataset.step;renderMain();return}if(d.tagName==='DETAILS'&&d.dataset.g&&d.open&&S.matOpen!==d.dataset.g){S.matOpen=d.dataset.g;renderTab()}},true);
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(()=>{if(S.view==='cust'&&S.tab==='print')renderPreview()},200)});
boot();
</script>

</body>
